[project]
name = "python-tools-testing"
version = "0.0.0"
description = "STUB (later phase): pytest fixtures, testcontainers, fake auth/LLM, contract-test bases."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-fastapi",
    "python-tools-events",
    "python-tools-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
