[project]
name = "python-tools-config"
version = "0.1.0"
description = "Shared service settings: env conventions, file-secret loading, redacted dumps."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
