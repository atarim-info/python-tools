[project]
name = "python-tools-jobs"
version = "0.0.0"
description = "STUB (later phase): async-job contract (202 + GET /jobs/{id}) and worker loop."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-logging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
