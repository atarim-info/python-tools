[project]
name = "python-tools-jobs"
version = "0.1.0"
description = "Async job contract, Mongo store, and worker claim loop."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-config",
    "python-tools-logging",
]

[project.optional-dependencies]
mongo = ["motor>=3.5", "pymongo>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
