[project]
name = "python-tools-auth"
version = "0.1.0"
description = "Auth principals and standalone API-key authentication (JWT/JWKS in a later wave)."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-config",
    "python-tools-logging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
