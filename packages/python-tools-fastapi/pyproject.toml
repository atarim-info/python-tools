[project]
name = "python-tools-fastapi"
version = "0.0.0"
description = "STUB (later phase): app factory, error envelope, middleware, pagination/ETag helpers."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-observability",
    "python-tools-auth",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
