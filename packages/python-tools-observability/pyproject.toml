[project]
name = "python-tools-observability"
version = "0.1.0"
description = "OpenTelemetry bootstrap (no-op by default), health checks, and Prometheus metrics."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "python-tools-config",
    "python-tools-logging",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
