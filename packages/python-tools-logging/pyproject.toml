[project]
name = "python-tools-logging"
version = "0.1.0"
description = "Structured (structlog) JSON logging with PII masking and correlation/trace IDs."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "structlog>=24.1",
    "python-tools-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
