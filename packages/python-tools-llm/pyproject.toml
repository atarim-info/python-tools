[project]
name = "python-tools-llm"
version = "0.0.0"
description = "STUB (later phase): provider port, model routing, prompt-pack loader, structured output."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-config",
    "python-tools-logging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
