[project]
name = "python-tools-storage"
version = "0.0.0"
description = "STUB (later phase): S3/MinIO, Mongo index, and Postgres engine helpers."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "python-tools-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_tools"]
