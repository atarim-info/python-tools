[mypy]
python_version = 3.12
strict = True
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/python-tools-config/src:packages/python-tools-logging/src:packages/python-tools-observability/src:packages/python-tools-auth/src:packages/python-tools-fastapi/src:packages/python-tools-events/src:packages/python-tools-jobs/src:packages/python-tools-storage/src:packages/python-tools-llm/src:packages/python-tools-testing/src
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
show_error_codes = True
exclude = (?x)(/tests/|(^|/)tests($|/)|_test\.py$)
